<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inicio</title>
    <meta charset="utf-8">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <script th:src="@{/js/jquery-3.3.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<header th:replace="fragments/navbar :: navbar"></header>

<div class="container">
    <div class="row">
        <div class="col-12">
            <h1>Productos en</h1>
            <h1 class="page-header">
                <small th:text="${localidad}">Localidad</small>
            </h1>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(productos)}">
        <h1><p class="text-center">Parece que no hay productos todavía</p></h1>
        <h1><p class="text-center">
            No esperes más y sé el primero en agregarlos ingresando
            <a th:href="@{/producto/nuevo}">aquí</a>.
        </p></h1>
    </div>

    <div class="row text-center" th:if="${!#lists.isEmpty(productos)}">
        <div class="col-lg-3 col-md-3 col-sm-12" th:each="p : ${productos}">
            <p class="text-left"><label th:text="${p.nombre}">Nombre</label></p>
            <a th:href="@{/producto/{id}(id=${p.id_producto})}">
                <img th:src="${p.imagen}" class="img-responsive" style="width:80%"/>
            </a>
        </div>
    </div>
</div>
</body>
</html>
